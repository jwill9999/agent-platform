name: CI

on:
  pull_request:
    branches:
      - main
      - staging
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native dependencies
        run: pnpm run rebuild:native

      - name: Format (check)
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Test
        run: pnpm run test

      - name: Seed (idempotent)
        run: |
          SQLITE_PATH=/tmp/agent-ci.sqlite pnpm run seed
          SQLITE_PATH=/tmp/agent-ci.sqlite pnpm run seed

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: agent-platform-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native dependencies
        run: pnpm run rebuild:native

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Prepare workspace storage
        run: make workspace-init

      - name: Start API + web (compose profile services)
        run: docker compose --profile services up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/health >/dev/null; then
              echo "api ready"
              exit 0
            fi
            sleep 2
          done
          echo "api did not become ready"
          docker compose --profile services ps
          exit 1

      - name: Wait for web
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3001/ >/dev/null; then
              echo "web ready"
              exit 0
            fi
            sleep 2
          done
          echo "web did not become ready"
          docker compose --profile services ps
          exit 1

      - name: E2E seed (default + specialist/MCP/skill)
        run: docker compose exec -T --env E2E_SEED=1 api node packages/db/dist/seed/run.js

      - name: Verify coding runtime CLI baseline
        run: docker compose exec -T api node scripts/coding-runtime-verify.mjs

      - name: Workspace persistence/security check
        env:
          API_URL: http://127.0.0.1:3000
        run: node scripts/workspace-compose-verify.mjs --write

      - name: Restart API for workspace persistence check
        run: docker compose --profile services restart api

      - name: Wait for API after restart
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/health >/dev/null; then
              echo "api ready after restart"
              exit 0
            fi
            sleep 2
          done
          echo "api did not become ready after restart"
          docker compose --profile services ps
          exit 1

      - name: Verify workspace file persisted after restart
        env:
          API_URL: http://127.0.0.1:3000
        run: node scripts/workspace-compose-verify.mjs

      - name: E2E tests
        env:
          BASE_URL: http://127.0.0.1:3001
          API_URL: http://127.0.0.1:3000
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Collect docker logs
        if: failure()
        run: |
          docker compose --profile services ps > docker-compose-ps.txt || true
          docker compose logs --no-color api > api-logs.txt || true

      - name: Upload docker logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-logs
          path: |
            docker-compose-ps.txt
            api-logs.txt

      - name: Stop compose
        if: always()
        run: docker compose --profile services down -v

  desktop-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native dependencies
        run: pnpm run rebuild:native

      - name: Install Electron binary
        run: node scripts/install-electron-binary.mjs

      - name: Install Electron display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Playwright browser dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Electron E2E tests
        run: xvfb-run -a pnpm --filter @agent-platform/desktop test:e2e

      - name: Upload Electron Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-playwright-report
          path: apps/desktop/playwright-report/

      - name: Upload Electron test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-test-results
          path: apps/desktop/test-results/

  staging-packaged-macos-vm-e2e:
    if: github.event_name == 'pull_request' && github.base_ref == 'staging'
    runs-on: [self-hosted, macOS, ARM64, agent-platform-vm]
    timeout-minutes: 60
    env:
      AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_URL: ${{ vars.AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_URL }}
      AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256: ${{ vars.AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify VM-capable Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          echo "This staging gate requires a self-hosted Apple Silicon runner with Virtualization.framework available."

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native dependencies
        run: pnpm run rebuild:native

      - name: Install Electron binary
        run: node scripts/install-electron-binary.mjs

      - name: Run macOS VM host preflight
        run: pnpm --filter @agent-platform/desktop native:vm:host-check -- --json

      - name: Restore or download pinned macOS VM assets
        run: |
          test -n "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_URL"
          test -n "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256"
          CACHE_ROOT="$HOME/.cache/agent-platform/macos-vm-assets"
          CACHE_DIR="$CACHE_ROOT/$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256"
          CACHE_ARCHIVE="$CACHE_DIR/agent-platform-macos-vm-assets-arm64.tgz"
          CACHE_ARCHIVE_TMP="$CACHE_ARCHIVE.tmp.$$"
          mkdir -p "$RUNNER_TEMP/macos-vm-assets"
          mkdir -p "$CACHE_DIR"

          if [ -f "$CACHE_ARCHIVE" ]; then
            if printf '%s  %s\n' \
              "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256" \
              "$CACHE_ARCHIVE" | shasum -a 256 -c -; then
              echo "Using cached macOS VM asset archive: $CACHE_ARCHIVE"
            else
              echo "Cached macOS VM asset archive failed checksum; re-downloading." >&2
              rm -f "$CACHE_ARCHIVE"
            fi
          fi

          if [ ! -f "$CACHE_ARCHIVE" ]; then
            echo "Downloading macOS VM asset archive into SHA cache: $CACHE_ARCHIVE"
            curl -fsSL --connect-timeout 10 --max-time 300 --retry 3 --retry-delay 5 \
              "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_URL" \
              -o "$CACHE_ARCHIVE_TMP"
            printf '%s  %s\n' \
              "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256" \
              "$CACHE_ARCHIVE_TMP" | shasum -a 256 -c -
            mv -f "$CACHE_ARCHIVE_TMP" "$CACHE_ARCHIVE"
          fi

          cp -f "$CACHE_ARCHIVE" "$RUNNER_TEMP/macos-vm-assets.tgz"
          printf '%s  %s\n' \
            "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256" \
            "$RUNNER_TEMP/macos-vm-assets.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/macos-vm-assets.tgz" -C "$RUNNER_TEMP/macos-vm-assets"

      - name: Resolve asset directory
        run: |
          if [ -f "$RUNNER_TEMP/macos-vm-assets/manifest.json" ]; then
            echo "AGENT_PLATFORM_MACOS_VM_ASSETS_DIR=$RUNNER_TEMP/macos-vm-assets" >> "$GITHUB_ENV"
          elif [ -f "$RUNNER_TEMP/macos-vm-assets/images/manifest.json" ]; then
            echo "AGENT_PLATFORM_MACOS_VM_ASSETS_DIR=$RUNNER_TEMP/macos-vm-assets/images" >> "$GITHUB_ENV"
          else
            echo "Downloaded VM asset archive does not contain manifest.json or images/manifest.json" >&2
            find "$RUNNER_TEMP/macos-vm-assets" -maxdepth 3 -type f >&2
            exit 1
          fi

      - name: Build and sign macOS VM helper
        run: |
          pnpm --filter @agent-platform/desktop native:vm:build
          pnpm --filter @agent-platform/desktop native:vm:sign-dev

      - name: Package macOS VM runtime resources
        run: |
          pnpm --filter @agent-platform/desktop native:vm:package -- \
            --assets-dir "$AGENT_PLATFORM_MACOS_VM_ASSETS_DIR" \
            --out-dir "$RUNNER_TEMP/agent-platform-resources/macos-vm" \
            --helper "$GITHUB_WORKSPACE/apps/desktop/native/macos-vm-runner/.build/arm64-apple-macosx/debug/macos-vm-runner" \
            --skip-build
          mkdir -p "$RUNNER_TEMP/agent-platform-vm-evidence"
          cp -f "$RUNNER_TEMP/agent-platform-resources/macos-vm/package-manifest.json" \
            "$RUNNER_TEMP/agent-platform-vm-evidence/package-manifest.json"
          cp -f "$RUNNER_TEMP/agent-platform-resources/macos-vm/images/manifest.json" \
            "$RUNNER_TEMP/agent-platform-vm-evidence/asset-manifest.json"
          rm -rf "$RUNNER_TEMP/macos-vm-assets" "$RUNNER_TEMP/macos-vm-assets.tgz"

      - name: Verify packaged macOS VM helper signing
        run: |
          pnpm --filter @agent-platform/desktop native:vm:verify-signing -- \
            --runtime-dir "$RUNNER_TEMP/agent-platform-resources/macos-vm" \
            --json > "$RUNNER_TEMP/agent-platform-vm-evidence/helper-signing-report.json"

      - name: Staging packaged macOS VM Electron E2E
        env:
          AGENT_PLATFORM_E2E_PACKAGED_VM_RESOURCES_DIR: ${{ runner.temp }}/agent-platform-resources
          AGENT_PLATFORM_E2E_EVIDENCE_DIR: ${{ runner.temp }}/agent-platform-vm-evidence
        run: pnpm --filter @agent-platform/desktop test:e2e -- e2e/packaged-vm-command.e2e.ts

      - name: Upload staging macOS VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-packaged-macos-vm-evidence
          path: ${{ runner.temp }}/agent-platform-vm-evidence/

      - name: Upload staging Electron test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-packaged-macos-vm-test-results
          path: apps/desktop/test-results/
