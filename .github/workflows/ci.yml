name: CI

on:
  pull_request:
    branches:
      - main
      - staging
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve long staging VM validations; this workflow runs only on PR events.
  cancel-in-progress: ${{ github.base_ref == 'main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Test macOS VM build-output discovery
        run: node --test apps/desktop/scripts/resolve-macos-vm-helper.node-test.mjs

      - name: Test historical archive trust boundaries
        run: >-
          node --test scripts/classify-historical-evidence.test.mjs
          scripts/qualify-historical-evidence.test.mjs
          scripts/verify-historical-evidence-provenance.test.mjs

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native dependencies
        run: pnpm run rebuild:native

      - name: Test dependency compatibility exceptions
        run: node --test scripts/dependency-security.test.mjs

      - name: Format (check)
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test Git delivery boundary fixtures
        # Node fixture controls require built SDK packages and are separate from browser journeys.
        run: node --test e2e/support/git-delivery/*.test.mjs

      - name: Shared Stop provider fixture controls
        run: node --test e2e/support/project-chat-stop/*.test.mjs

      - name: Test local diagnostic command boundaries
        run: node --test scripts/diagnostics.test.mjs scripts/monitoring.test.mjs scripts/pre-push.test.mjs

      - name: Prepare private interpreter for pinned execution tests
        shell: bash
        run: |
          # Keep the shared toolcache untouched; production pin checks reject group-writable binaries.
          workflow_test_bin=$(mktemp -d "$RUNNER_TEMP/workflow-test-bin.XXXXXX")
          install -m 700 "$(readlink -f "$(command -v node)")" "$workflow_test_bin/node"
          "$workflow_test_bin/node" --version
          echo "$workflow_test_bin" >> "$GITHUB_PATH"

      - name: Test
        # Includes default packages/db MIG-R01–05 migration/preservation/rollback regressions.
        # Keep timing and physical-storage measurements free of competing test suites.
        # The one excluded test runs in the required fresh-process step immediately below.
        run: pnpm -r --workspace-concurrency=1 run test --maxWorkers=1 --no-file-parallelism --exclude '**/diagnostics.performance.test.ts'

      - name: Diagnostic performance in a fresh process
        env:
          DIAGNOSTICS_BENCHMARK_RESULT: ${{ runner.temp }}/diagnostics-benchmark.json
        # Preserve the full benchmark workload, deadlines and assertions, without the API suite's reused fork.
        run: pnpm --filter @agent-platform/api exec vitest run test/diagnostics.performance.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Upload diagnostic benchmark measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-benchmark
          path: ${{ runner.temp }}/diagnostics-benchmark.json*
          retention-days: 7

      - name: Seed (idempotent)
        run: |
          SQLITE_PATH=/tmp/agent-ci.sqlite pnpm run seed
          SQLITE_PATH=/tmp/agent-ci.sqlite pnpm run seed

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: agent-platform-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Existing browser projects retain their qualified GitHub-read boundary.
      COMPOSE_FILE: docker-compose.yml:docker-compose.github-read-e2e.yml
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native dependencies
        run: pnpm run rebuild:native

      - name: Install Playwright browser dependencies
        run: |
          google-chrome --version
          ./node_modules/.bin/playwright install-deps chromium

      - name: Prepare workspace storage
        run: make workspace-init

      - name: Start API + web (compose profile services)
        run: docker compose -f docker-compose.yml -f docker-compose.github-read-e2e.yml --profile services up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/health >/dev/null; then
              echo "api ready"
              exit 0
            fi
            sleep 2
          done
          echo "api did not become ready"
          docker compose --profile services ps
          exit 1

      - name: Wait for web
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3001/ >/dev/null; then
              echo "web ready"
              exit 0
            fi
            sleep 2
          done
          echo "web did not become ready"
          docker compose --profile services ps
          exit 1

      - name: E2E seed (default + specialist/MCP/skill)
        run: docker compose exec -T --env E2E_SEED=1 api node packages/db/dist/seed/run.js

      - name: Verify coding runtime CLI baseline
        run: docker compose exec -T api node scripts/coding-runtime-verify.mjs

      - name: Workspace persistence/security check
        env:
          API_URL: http://127.0.0.1:3000
        run: node scripts/workspace-compose-verify.mjs --write

      - name: Restart API for workspace persistence check
        run: docker compose --profile services restart api

      - name: Wait for API after restart
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/health >/dev/null; then
              echo "api ready after restart"
              exit 0
            fi
            sleep 2
          done
          echo "api did not become ready after restart"
          docker compose --profile services ps
          exit 1

      - name: Verify workspace file persisted after restart
        env:
          API_URL: http://127.0.0.1:3000
        run: node scripts/workspace-compose-verify.mjs

      - name: E2E tests
        env:
          BASE_URL: http://127.0.0.1:3001
          API_URL: http://127.0.0.1:3000
        run: pnpm run test:e2e --project=chromium --project=chat-reply --project=github-read --project=mcp-onboarding

      - name: Preserve first browser phase logs
        run: |
          docker compose --profile services ps > github-read-compose-ps.txt
          docker compose logs --no-color api > github-read-api-logs.txt

      - name: Select isolated Git delivery boundary
        run: |
          docker compose -f docker-compose.yml -f e2e/support/git-delivery/compose.yml --profile services up -d --no-deps --force-recreate api
          echo "COMPOSE_FILE=docker-compose.yml:e2e/support/git-delivery/compose.yml" >> "$GITHUB_ENV"
          git_delivery_api_container=$(docker compose -f docker-compose.yml -f e2e/support/git-delivery/compose.yml ps -q api)
          test -n "$git_delivery_api_container"
          echo "GIT_DELIVERY_API_CONTAINER=$git_delivery_api_container" >> "$GITHUB_ENV"

      - name: Wait for Git delivery API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/health >/dev/null; then
              echo "Git delivery api ready"
              exit 0
            fi
            sleep 2
          done
          docker compose --profile services ps
          exit 1

      - name: Git delivery browser tests
        env:
          BASE_URL: http://127.0.0.1:3001
          API_URL: http://127.0.0.1:3000
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-git-delivery
        run: pnpm run test:e2e --project=git-delivery --no-deps --output=test-results-git-delivery

      - name: Upload Git delivery browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-delivery-browser-report
          path: |
            playwright-report-git-delivery/
            test-results-git-delivery/

      - name: Prepare pinned Stop sensor fixture command
        # The command remains the production fixed pnpm binary. Resolve its image-pinned
        # Corepack payload as the runtime user before measuring controlled command entry.
        run: |
          sensor_setup_started=$SECONDS
          sensor_pnpm_version=$(timeout 60s docker compose exec -T --user appuser api /usr/local/bin/pnpm --version)
          test "$sensor_pnpm_version" = "9.15.4"
          echo "Stop sensor pnpm $sensor_pnpm_version ready after $((SECONDS - sensor_setup_started)) seconds"

      - name: Shared Stop browser tests
        env:
          BASE_URL: http://127.0.0.1:3001
          API_URL: http://127.0.0.1:3000
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-project-chat-stop
        run: pnpm run test:e2e --project=project-chat-stop --no-deps --output=test-results-project-chat-stop

      - name: Upload shared Stop browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-chat-stop-browser-report
          path: |
            playwright-report-project-chat-stop/
            test-results-project-chat-stop/

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/

      - name: Collect docker logs
        if: failure()
        run: |
          docker compose --profile services ps > docker-compose-ps.txt || true
          docker compose logs --no-color api > api-logs.txt || true

      - name: Upload docker logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-logs
          path: |
            docker-compose-ps.txt
            api-logs.txt
            github-read-compose-ps.txt
            github-read-api-logs.txt

      - name: Stop compose
        if: always()
        run: docker compose --profile services down -v

  desktop-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        id: desktop-pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native dependencies
        run: pnpm run rebuild:native

      - name: Install Electron binary
        run: node scripts/install-electron-binary.mjs

      - name: Install Electron display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install browser for connected diagnostics export
        # Invoke the already lockfile-installed browser CLI; this is not a package install.
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Prepare fixed desktop sensor command
        # The pinned action installs outside the product's fixed pnpm locations.
        # Link its actual JS payload, not the .bin shell shim with relative paths.
        env:
          PNPM_ACTION_DEST: ${{ steps.desktop-pnpm.outputs.dest }}
        run: |
          sensor_pnpm_payload=$(node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const actionRoot = fs.realpathSync(process.env.PNPM_ACTION_DEST);
          const packageRoot = fs.realpathSync(path.join(actionRoot, 'node_modules', 'pnpm'));
          if (!packageRoot.startsWith(actionRoot + path.sep)) throw new Error('Unexpected pnpm package location');
          const metadata = JSON.parse(fs.readFileSync(path.join(packageRoot, 'package.json'), 'utf8'));
          if (metadata.name !== 'pnpm' || metadata.version !== '9.15.4' || metadata.bin.pnpm !== 'bin/pnpm.cjs') {
            throw new Error('Unexpected action-installed pnpm payload');
          }
          const payload = fs.realpathSync(path.join(packageRoot, 'bin', 'pnpm.cjs'));
          if (payload !== path.join(packageRoot, 'bin', 'pnpm.cjs') || !fs.statSync(payload).isFile()) {
            throw new Error('Unexpected pnpm executable location');
          }
          fs.accessSync(payload, fs.constants.X_OK);
          process.stdout.write(payload);
          NODE
          )
          if [ -e /usr/local/bin/pnpm ] || [ -L /usr/local/bin/pnpm ]; then
            test -L /usr/local/bin/pnpm
            test "$(readlink -f /usr/local/bin/pnpm)" = "$sensor_pnpm_payload"
          else
            sudo ln -s -- "$sensor_pnpm_payload" /usr/local/bin/pnpm
          fi
          sensor_node=$(node -p 'process.execPath')
          sensor_home=$(mktemp -d "$RUNNER_TEMP/desktop-sensor-home.XXXXXX")
          trap 'rm -rf -- "$sensor_home"' EXIT
          sensor_version=$(timeout 30s env -i HOME="$sensor_home" \
            PATH="$(dirname "$sensor_node"):/usr/bin:/bin:/usr/sbin:/sbin" \
            /usr/local/bin/pnpm --version)
          test "$sensor_version" = '9.15.4'
          echo "Fixed desktop sensor pnpm $sensor_version verified with current Node"

      - name: Electron E2E tests
        # Includes migration-startup.e2e.ts (MIG-R06): retained upgrade and fail-closed startup.
        run: xvfb-run -a pnpm --filter @agent-platform/desktop test:e2e

      - name: Upload Electron Playwright report
        # Retain the first failed attempt even when Playwright's retry succeeds.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-playwright-report
          path: apps/desktop/playwright-report/

      - name: Upload Electron test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-test-results
          path: apps/desktop/test-results/

  staging-packaged-macos-vm-e2e:
    if: github.event_name == 'pull_request' && github.base_ref == 'staging'
    runs-on: [self-hosted, macOS, ARM64, agent-platform-vm]
    timeout-minutes: 60
    env:
      AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_URL: ${{ vars.AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_URL }}
      AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256: ${{ vars.AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify VM-capable Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          echo "This staging gate requires a self-hosted Apple Silicon runner with Virtualization.framework available."

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native dependencies
        run: pnpm run rebuild:native

      - name: Install Electron binary
        run: node scripts/install-electron-binary.mjs

      - name: Verify native macOS secure-storage startup
        timeout-minutes: 2
        # Fixture keys bypass Keychain initialization in the main Electron journeys.
        # This independent native check must exercise the OS API without that override.
        run: env -u SECRETS_MASTER_KEY pnpm --filter @agent-platform/desktop test:native:secret-storage

      - name: Run macOS VM host preflight
        run: pnpm --filter @agent-platform/desktop native:vm:host-check -- --json

      - name: Restore or download pinned macOS VM assets
        run: |
          test -n "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_URL"
          test -n "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256"
          CACHE_ROOT="$HOME/.cache/agent-platform/macos-vm-assets"
          CACHE_DIR="$CACHE_ROOT/$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256"
          CACHE_ARCHIVE="$CACHE_DIR/agent-platform-macos-vm-assets-arm64.tgz"
          CACHE_ARCHIVE_TMP="$CACHE_ARCHIVE.tmp.$$"
          mkdir -p "$RUNNER_TEMP/macos-vm-assets"
          mkdir -p "$CACHE_DIR"

          if [ -f "$CACHE_ARCHIVE" ]; then
            if printf '%s  %s\n' \
              "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256" \
              "$CACHE_ARCHIVE" | shasum -a 256 -c -; then
              echo "Using cached macOS VM asset archive: $CACHE_ARCHIVE"
            else
              echo "Cached macOS VM asset archive failed checksum; re-downloading." >&2
              rm -f "$CACHE_ARCHIVE"
            fi
          fi

          if [ ! -f "$CACHE_ARCHIVE" ]; then
            echo "Downloading macOS VM asset archive into SHA cache: $CACHE_ARCHIVE"
            curl -fsSL --connect-timeout 10 --max-time 300 --retry 3 --retry-delay 5 \
              "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_URL" \
              -o "$CACHE_ARCHIVE_TMP"
            printf '%s  %s\n' \
              "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256" \
              "$CACHE_ARCHIVE_TMP" | shasum -a 256 -c -
            mv -f "$CACHE_ARCHIVE_TMP" "$CACHE_ARCHIVE"
          fi

          cp -f "$CACHE_ARCHIVE" "$RUNNER_TEMP/macos-vm-assets.tgz"
          printf '%s  %s\n' \
            "$AGENT_PLATFORM_MACOS_VM_ASSET_ARCHIVE_SHA256" \
            "$RUNNER_TEMP/macos-vm-assets.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/macos-vm-assets.tgz" -C "$RUNNER_TEMP/macos-vm-assets"

      - name: Resolve asset directory
        run: |
          if [ -f "$RUNNER_TEMP/macos-vm-assets/manifest.json" ]; then
            echo "AGENT_PLATFORM_MACOS_VM_ASSETS_DIR=$RUNNER_TEMP/macos-vm-assets" >> "$GITHUB_ENV"
          elif [ -f "$RUNNER_TEMP/macos-vm-assets/images/manifest.json" ]; then
            echo "AGENT_PLATFORM_MACOS_VM_ASSETS_DIR=$RUNNER_TEMP/macos-vm-assets/images" >> "$GITHUB_ENV"
          else
            echo "Downloaded VM asset archive does not contain manifest.json or images/manifest.json" >&2
            find "$RUNNER_TEMP/macos-vm-assets" -maxdepth 3 -type f >&2
            exit 1
          fi

      - name: Build and sign macOS VM helper
        run: |
          pnpm --filter @agent-platform/desktop native:vm:build
          HELPER_PATH="$(node apps/desktop/scripts/resolve-macos-vm-helper.mjs)"
          pnpm --filter @agent-platform/desktop native:vm:sign-dev -- --helper "$HELPER_PATH"
          printf 'AGENT_PLATFORM_MACOS_VM_SIGNED_HELPER=%s\n' "$HELPER_PATH" >> "$GITHUB_ENV"

      - name: Package macOS VM runtime resources
        run: |
          pnpm --filter @agent-platform/desktop native:vm:package -- \
            --assets-dir "$AGENT_PLATFORM_MACOS_VM_ASSETS_DIR" \
            --out-dir "$RUNNER_TEMP/agent-platform-resources/macos-vm" \
            --helper "$AGENT_PLATFORM_MACOS_VM_SIGNED_HELPER" \
            --skip-build
          mkdir -p "$RUNNER_TEMP/agent-platform-vm-evidence"
          cp -f "$RUNNER_TEMP/agent-platform-resources/macos-vm/package-manifest.json" \
            "$RUNNER_TEMP/agent-platform-vm-evidence/package-manifest.json"
          cp -f "$RUNNER_TEMP/agent-platform-resources/macos-vm/images/manifest.json" \
            "$RUNNER_TEMP/agent-platform-vm-evidence/asset-manifest.json"
          rm -rf "$RUNNER_TEMP/macos-vm-assets" "$RUNNER_TEMP/macos-vm-assets.tgz"

      - name: Verify packaged macOS VM helper signing
        run: |
          pnpm --filter @agent-platform/desktop native:vm:verify-signing -- \
            --runtime-dir "$RUNNER_TEMP/agent-platform-resources/macos-vm" \
            --json > "$RUNNER_TEMP/agent-platform-vm-evidence/helper-signing-report.json"

      - name: Staging packaged macOS VM Electron E2E
        env:
          AGENT_PLATFORM_E2E_PACKAGED_VM_RESOURCES_DIR: ${{ runner.temp }}/agent-platform-resources
          AGENT_PLATFORM_E2E_EVIDENCE_DIR: ${{ runner.temp }}/agent-platform-vm-evidence
        run: pnpm --filter @agent-platform/desktop test:e2e -- e2e/packaged-vm-command.e2e.ts

      - name: Upload staging macOS VM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-packaged-macos-vm-evidence
          path: ${{ runner.temp }}/agent-platform-vm-evidence/

      - name: Upload staging Electron test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-packaged-macos-vm-test-results
          path: apps/desktop/test-results/
