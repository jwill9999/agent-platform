name: Dependency Security

on:
  pull_request:
    branches: [main, staging, 'feature/**']
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test comparison completeness controls
        run: node --test scripts/dependency-review.test.mjs
      - name: Reject newly introduced vulnerable dependencies
        id: vendor
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: false
          show-openssf-scorecard: false
          comment-summary-in-pr: never
          warn-only: false
          retry-on-snapshot-warnings: false
      - name: Bind complete exact-revision data to the vendor's actual inventory
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPENDENCY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDENCY_RECEIPT: ${{ runner.temp }}/dependency-comparison.json
          VENDOR_OUTCOME: ${{ steps.vendor.outcome }}
          VENDOR_CHANGES: ${{ steps.vendor.outputs.dependency-changes }}
        run: node scripts/dependency-review.mjs
      - name: Retain comparison provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-comparison
          path: ${{ runner.temp }}/dependency-comparison.json
          if-no-files-found: error
          retention-days: 14

  reverse-control:
    name: Dependency review negative control
    # Read existing revisions in reverse; never install or execute vulnerable source.
    if: github.event_name == 'pull_request' && github.head_ref == 'task/dependency-security'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Vendor must reject reintroduced development and runtime advisories
        id: reverse
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.head.sha }}
          head-ref: ${{ github.event.pull_request.base.sha }}
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: false
          show-openssf-scorecard: false
          comment-summary-in-pr: never
          warn-only: false
          retry-on-snapshot-warnings: false
      - name: Verify specific rejections and complete exact-revision data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_BASE_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDENCY_HEAD_SHA: ${{ github.event.pull_request.base.sha }}
          DEPENDENCY_RECEIPT: ${{ runner.temp }}/dependency-negative-comparison.json
          DEPENDENCY_NEGATIVE_CONTROL: 'true'
          VENDOR_OUTCOME: ${{ steps.reverse.outcome }}
          VENDOR_CHANGES: ${{ steps.reverse.outputs.dependency-changes }}
          VENDOR_VULNERABLE_CHANGES: ${{ steps.reverse.outputs.vulnerable-changes }}
          EXPECTED_ADVISORIES: >-
            [{"name":"vitest","version":"2.1.9","scope":"development","ghsa":"GHSA-5xrq-8626-4rwp","severity":"critical"},
             {"name":"next","version":"15.5.15","scope":"runtime","ghsa":"GHSA-p293-qw3h-jr36","severity":"critical"}]
        run: node scripts/dependency-review.mjs
      - name: Retain negative-control provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-negative-control
          path: ${{ runner.temp }}/dependency-negative-comparison.json
          if-no-files-found: error
          retention-days: 14

  full-development-audit:
    name: Full staging dependency audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: staging
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Record actual scanned revision
        env:
          RECEIPT: ${{ runner.temp }}/audit-source.txt
        run: git rev-parse HEAD > "$RECEIPT"
      - name: Audit the complete lockfile without installing packages
        env:
          AUDIT_REPORT: ${{ runner.temp }}/dependency-audit.json
        run: pnpm audit --audit-level=high --json > "$AUDIT_REPORT"
      - name: Retain audit and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-dependency-audit
          path: |
            ${{ runner.temp }}/dependency-audit.json
            ${{ runner.temp }}/audit-source.txt
          if-no-files-found: error
          retention-days: 14
