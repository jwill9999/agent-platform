version: 2
updates:
  # Owner selected staging as default; security and version proposals now start there.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/London
    open-pull-requests-limit: 3
    groups:
      sdk-security:
        applies-to: security-updates
        patterns: ['ai', '@ai-sdk/*']
      sdk-version-updates:
        applies-to: version-updates
        patterns: ['ai', '@ai-sdk/*']
      security-patches:
        applies-to: security-updates
        patterns: ['*']
        exclude-patterns: ['ai', '@ai-sdk/*']
        update-types: [minor, patch]
      compatible-updates:
        applies-to: version-updates
        patterns: ['*']
        exclude-patterns: ['ai', '@ai-sdk/*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/London
    open-pull-requests-limit: 2
    groups:
      action-patches:
        patterns: ['*']
        update-types: [minor, patch]
