# Test-only external GitHub boundary. The serialized Git fixture creates/removes these
# appuser-owned files; absent state fails closed. Never load this overlay in normal use.
services:
  api:
    environment:
      AGENT_PLATFORM_GH_BINARY: /home/appuser/.agent-platform-git-delivery-boundary/gh
      GIT_DELIVERY_GH_FIXTURE_DIR: /home/appuser/.agent-platform-git-delivery-boundary/state
      # The selected serialized journey owns this in-container inert HTTP provider.
      # No host Ollama process or external model service is used by these tests.
      OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
